<!DOCTYPE html>
<html lang="en">
<head>
<script src="/shared/recovery-redirect.js"></script>
<script src="/shared/luma-loader.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0a0e1a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LUMA">
  <link rel="apple-touch-icon" href="/shared/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/shared/icons/favicon-32.png">
<title>LUMA · Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="../shared/auth-mobile.css">
</head>
<body>
  <form class="auth" id="loginForm">
    <div class="brand">
      <div class="ic"><i class="fa-solid fa-bolt"></i></div>
      <div><h1>LUMA</h1><p>Your Personal OS</p><p class="luma-ver" data-luma-version style="font-size:11px;letter-spacing:.03em;opacity:.7;margin-top:1px"></p></div>
    </div>
    <div class="head">
      <h2>Welcome back</h2>
      <span>Sign in to pick up where you left off.</span>
    </div>
    <div class="msg error" id="formError"></div>
    <div class="msg ok" id="formOk"></div>
    <div class="field">
      <label>Email</label>
      <div class="inp"><i class="fa-regular fa-envelope"></i><input type="email" id="email" placeholder="you@luma.os" required></div>
    </div>
    <div class="field">
      <label>Password</label>
      <div class="inp"><i class="fa-solid fa-lock"></i><input type="password" id="pw" placeholder="••••••••" required><i class="fa-regular fa-eye eye" onclick="const p=document.getElementById('pw');p.type=p.type==='password'?'text':'password';this.className=p.type==='password'?'fa-regular fa-eye eye':'fa-regular fa-eye-slash eye';"></i></div>
    </div>
    <div class="row">
      <label><input type="checkbox" id="remember" checked> Remember me</label>
      <a href="#" id="forgotLink">Forgot password?</a>
    </div>
    <button class="btn" type="submit" id="submitBtn">Sign in <i class="fa-solid fa-arrow-right"></i></button>
    <div class="divider">or continue with</div>
    <div class="social">
      <button type="button" onclick="LumaAuth._comingSoon(this)"><i class="fa-brands fa-google"></i> Google</button>
      <button type="button" onclick="LumaAuth._comingSoon(this)"><i class="fa-brands fa-apple"></i> Apple</button>
    </div>
    <div class="foot">Don't have an account? <a href="/register/">Create one</a></div>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/shared/supabase-config.js"></script>
  <script src="/shared/luma-auth.js"></script>
  <script src="login.js"></script>
</body>
</html>
