<!DOCTYPE html>
<html lang="en">
<head>
<script src="/shared/luma-loader.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0a0e1a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LUMA">
  <link rel="apple-touch-icon" href="/shared/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/shared/icons/favicon-32.png">
<title>LUMA · Reset password</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="reset-password.css">
  <link rel="stylesheet" href="../shared/auth-mobile.css">
</head>
<body>
  <form class="auth" id="resetForm">
    <div class="brand">
      <div class="ic"><i class="fa-solid fa-bolt"></i></div>
      <div><h1>LUMA</h1><p>Your Personal OS</p></div>
    </div>
    <div class="head">
      <h2>Set a new password</h2>
      <span id="headSub">Opened from your email link — choose a new password below.</span>
    </div>
    <div class="msg error" id="formError"></div>
    <div class="msg ok" id="formOk"></div>
    <div class="field">
      <label>New password</label>
      <div class="inp"><i class="fa-solid fa-lock"></i><input type="password" id="pw" placeholder="Create a new password" required minlength="6"><i class="fa-regular fa-eye eye" onclick="const p=document.getElementById('pw');p.type=p.type==='password'?'text':'password';this.className=p.type==='password'?'fa-regular fa-eye eye':'fa-regular fa-eye-slash eye';"></i></div>
    </div>
    <div class="field">
      <label>Confirm new password</label>
      <div class="inp"><i class="fa-solid fa-lock"></i><input type="password" id="pw2" placeholder="Re-enter your new password" required><i class="fa-regular fa-eye eye" onclick="const p=document.getElementById('pw2');p.type=p.type==='password'?'text':'password';this.className=p.type==='password'?'fa-regular fa-eye eye':'fa-regular fa-eye-slash eye';"></i></div>
    </div>
    <button class="btn" type="submit" id="submitBtn">Update password <i class="fa-solid fa-arrow-right"></i></button>
    <div class="foot"><a href="/login/">Back to sign in</a></div>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/shared/supabase-config.js"></script>
  <script src="/shared/luma-auth.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>
