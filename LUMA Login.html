<!DOCTYPE html>
<html lang="en">
<head>
<script>if (/type=recovery/.test(location.hash)) location.replace("LUMA%20Reset%20Password.html" + location.hash);</script>
<script src="assets/luma-loader.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUMA · Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow-y:auto;background:#0a0e1a;}
body::before{content:'';position:fixed;inset:0;background:url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1920&q=80') center/cover no-repeat;filter:brightness(0.45) saturate(0.8) blur(1px);transform:scale(1.05);z-index:0;}
body::after{content:'';position:fixed;inset:0;background:rgba(6,10,20,0.35);z-index:0;}
.auth{position:relative;z-index:2;width:420px;max-width:100%;padding:38px 34px;border-radius:28px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);backdrop-filter:blur(34px) saturate(1.4);-webkit-backdrop-filter:blur(34px) saturate(1.4);box-shadow:0 24px 70px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.1);}
.brand{display:flex;align-items:center;gap:13px;margin-bottom:28px;}
.brand .ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-size:20px;box-shadow:0 0 26px rgba(59,130,246,0.35);}
.brand h1{color:#fff;font-size:19px;font-weight:600;letter-spacing:-0.01em;}
.brand p{color:rgba(255,255,255,0.4);font-size:12px;margin-top:2px;}
.head{margin-bottom:24px;}
.head h2{color:#fff;font-size:1.5rem;font-weight:600;letter-spacing:-0.02em;}
.head span{color:rgba(255,255,255,0.5);font-size:0.85rem;margin-top:6px;display:block;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:0.72rem;font-weight:500;color:rgba(255,255,255,0.55);margin-bottom:7px;}
.inp{display:flex;align-items:center;gap:11px;padding:0 15px;height:48px;border-radius:14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);transition:0.2s;}
.inp:focus-within{border-color:#3b82f6;background:rgba(59,130,246,0.08);}
.inp i{color:rgba(255,255,255,0.4);font-size:0.9rem;width:18px;text-align:center;}
.inp input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:0.9rem;}
.inp input::placeholder{color:rgba(255,255,255,0.3);}
.inp .eye{cursor:pointer;}
.row{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;font-size:0.78rem;}
.row label{display:flex;align-items:center;gap:8px;color:rgba(255,255,255,0.6);cursor:pointer;}
.row input[type=checkbox]{-webkit-appearance:none;appearance:none;flex:none;width:20px;height:20px;margin:0;border-radius:50%;border:1.5px solid rgba(255,255,255,0.3);background:transparent;cursor:pointer;display:grid;place-items:center;transition:0.2s;}
.row input[type=checkbox]::after{content:"\f00c";font-family:"Font Awesome 6 Free";font-weight:900;font-size:0.6rem;color:#fff;transform:scale(0);transition:0.15s;}
.row input[type=checkbox]:checked{background:linear-gradient(135deg,#3b82f6,#6366f1);border-color:transparent;box-shadow:0 0 12px rgba(59,130,246,0.5);}
.row input[type=checkbox]:checked::after{transform:scale(1);}
.row a{color:#60a5fa;text-decoration:none;}
.btn{width:100%;height:50px;border:none;border-radius:14px;background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;font-size:0.92rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 10px 28px rgba(37,99,235,0.4);transition:0.2s;}
.btn:hover{transform:translateY(-1px);box-shadow:0 12px 32px rgba(37,99,235,0.5);}
.divider{display:flex;align-items:center;gap:14px;margin:22px 0;color:rgba(255,255,255,0.3);font-size:0.72rem;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.1);}
.social{display:flex;gap:10px;}
.social button{flex:1;height:46px;border-radius:13px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.8);font-size:0.98rem;cursor:pointer;transition:0.2s;display:flex;align-items:center;justify-content:center;gap:8px;}
.social button:hover{background:rgba(255,255,255,0.1);}
.foot{text-align:center;margin-top:24px;font-size:0.82rem;color:rgba(255,255,255,0.5);}
.foot a{color:#60a5fa;text-decoration:none;font-weight:600;}
.msg{display:none;align-items:center;gap:9px;padding:11px 14px;border-radius:12px;font-size:0.78rem;line-height:1.5;margin-bottom:16px;}
.msg.error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);color:#fca5a5;}
.msg.ok{background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.25);color:#6ee7b7;}
.btn[disabled]{opacity:0.6;cursor:default;transform:none !important;}
</style>
</head>
<body>
  <form class="auth" id="loginForm">
    <div class="brand">
      <div class="ic"><i class="fa-solid fa-bolt"></i></div>
      <div><h1>LUMA</h1><p>Your Personal OS</p></div>
    </div>
    <div class="head">
      <h2>Welcome back</h2>
      <span>Sign in to pick up where you left off.</span>
    </div>
    <div class="msg error" id="formError"></div>
    <div class="msg ok" id="formOk"></div>
    <div class="field">
      <label>Email</label>
      <div class="inp"><i class="fa-regular fa-envelope"></i><input type="email" id="email" placeholder="you@luma.os" required></div>
    </div>
    <div class="field">
      <label>Password</label>
      <div class="inp"><i class="fa-solid fa-lock"></i><input type="password" id="pw" placeholder="••••••••" required><i class="fa-regular fa-eye eye" onclick="const p=document.getElementById('pw');p.type=p.type==='password'?'text':'password';this.className=p.type==='password'?'fa-regular fa-eye eye':'fa-regular fa-eye-slash eye';"></i></div>
    </div>
    <div class="row">
      <label><input type="checkbox" id="remember" checked> Remember me</label>
      <a href="#" id="forgotLink">Forgot password?</a>
    </div>
    <button class="btn" type="submit" id="submitBtn">Sign in <i class="fa-solid fa-arrow-right"></i></button>
    <div class="divider">or continue with</div>
    <div class="social">
      <button type="button" onclick="LumaAuth._comingSoon(this)"><i class="fa-brands fa-google"></i> Google</button>
      <button type="button" onclick="LumaAuth._comingSoon(this)"><i class="fa-brands fa-apple"></i> Apple</button>
    </div>
    <div class="foot">Don't have an account? <a href="LUMA Register.html">Create one</a></div>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabase-config.js"></script>
  <script src="assets/luma-auth.js"></script>
  <script>
    LumaAuth.redirectIfSignedIn();

    // restore the last choice and, if remembered, the email
    const rememberEl = document.getElementById("remember");
    rememberEl.checked = LumaAuth.isRemembered();
    try {
      const saved = localStorage.getItem("luma.rememberedEmail");
      if (saved && rememberEl.checked) document.getElementById("email").value = saved;
    } catch (e) {}

    LumaAuth._comingSoon = (btn) => {
      const label = btn.textContent.trim();
      showError(label + " sign-in isn't connected yet — use email for now.");
    };

    const form = document.getElementById("loginForm");
    const errEl = document.getElementById("formError");
    const okEl = document.getElementById("formOk");
    const submitBtn = document.getElementById("submitBtn");

    function showError(text) {
      okEl.style.display = "none";
      errEl.textContent = text;
      errEl.style.display = "flex";
    }
    function showOk(text) {
      errEl.style.display = "none";
      okEl.textContent = text;
      okEl.style.display = "flex";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errEl.style.display = "none";
      okEl.style.display = "none";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("pw").value;

      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Signing in…';

      const remember = rememberEl.checked;
      const { error } = await LumaAuth.signIn({ email, password, remember });

      if (error) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Sign in <i class="fa-solid fa-arrow-right"></i>';
        if (/not confirmed/i.test(error.message || "")) { // the account exists but the email was never verified: send a fresh code
          await LumaAuth.resendSignupCode(email);
          window.location.href = "LUMA Verify Email.html?sent=1&email=" + encodeURIComponent(email);
          return;
        }
        showError(error.message);
        return;
      }

      try {
        if (remember) localStorage.setItem("luma.rememberedEmail", email);
        else localStorage.removeItem("luma.rememberedEmail");
      } catch (e) {}
      window.location.href = "LUMA Glass Dashboard.html";
    });

    document.getElementById("forgotLink").addEventListener("click", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      if (!email) {
        showError("Enter your email above first, then click “Forgot password?”");
        return;
      }
      const { error } = await LumaAuth.sendPasswordReset(email);
      if (error) {
        const message = error.code === "email_address_invalid" || error.message.includes("Email address")
          ? "This Supabase project blocks @example.com addresses. Use a real email address, such as Gmail, to receive the reset link."
          : error.message;
        showError(message);
        return;
      }
      showOk("Password reset link sent to " + email + ".");
    });
  </script>
</body>
</html>
