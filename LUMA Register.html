<!DOCTYPE html>
<html lang="en">
<head>
<script src="assets/luma-loader.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUMA · Create account</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow-y:auto;background:#0a0e1a;}
body::before{content:'';position:fixed;inset:0;background:url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1920&q=80') center/cover no-repeat;filter:brightness(0.45) saturate(0.8) blur(1px);transform:scale(1.05);z-index:0;}
body::after{content:'';position:fixed;inset:0;background:rgba(6,10,20,0.35);z-index:0;}
.auth{position:relative;z-index:2;width:440px;max-width:100%;padding:38px 34px;border-radius:28px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);backdrop-filter:blur(34px) saturate(1.4);-webkit-backdrop-filter:blur(34px) saturate(1.4);box-shadow:0 24px 70px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.1);}
.brand{display:flex;align-items:center;gap:13px;margin-bottom:24px;}
.brand .ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-size:20px;box-shadow:0 0 26px rgba(59,130,246,0.35);}
.brand h1{color:#fff;font-size:19px;font-weight:600;letter-spacing:-0.01em;}
.brand p{color:rgba(255,255,255,0.4);font-size:12px;margin-top:2px;}
.head{margin-bottom:22px;}
.head h2{color:#fff;font-size:1.5rem;font-weight:600;letter-spacing:-0.02em;}
.head span{color:rgba(255,255,255,0.5);font-size:0.85rem;margin-top:6px;display:block;}
.field{margin-bottom:15px;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.two .field{min-width:0;}
.field label{display:block;font-size:0.72rem;font-weight:500;color:rgba(255,255,255,0.55);margin-bottom:7px;}
.inp{display:flex;align-items:center;gap:11px;padding:0 15px;height:48px;border-radius:14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);transition:0.2s;}
.inp:focus-within{border-color:#3b82f6;background:rgba(59,130,246,0.08);}
.inp i{color:rgba(255,255,255,0.4);font-size:0.9rem;width:18px;text-align:center;}
.inp input{flex:1;min-width:0;background:transparent;border:none;outline:none;color:#fff;font-size:0.9rem;}
.inp input::placeholder{color:rgba(255,255,255,0.3);}
.inp select{flex:1;min-width:0;height:100%;background:transparent;border:none;outline:none;color:#fff;font-size:0.9rem;cursor:pointer;appearance:none;-webkit-appearance:none;font-family:inherit;}
.inp select:invalid{color:rgba(255,255,255,0.3);}
.inp select option{background:#141a2c;color:#fff;}
.inp .caret{margin-left:auto;font-size:0.7rem;pointer-events:none;}
.strength{display:flex;gap:5px;margin-top:9px;}
.strength span{flex:1;height:4px;border-radius:3px;background:rgba(255,255,255,0.1);transition:0.3s;}
.strength span.on{background:linear-gradient(90deg,#2563eb,#3b82f6);}
.agree{display:flex;align-items:flex-start;gap:9px;margin:6px 0 20px;font-size:0.76rem;color:rgba(255,255,255,0.55);line-height:1.5;cursor:pointer;}
.agree input{accent-color:#3b82f6;width:15px;height:15px;margin-top:2px;flex-shrink:0;}
.agree a{color:#60a5fa;text-decoration:none;}
.btn{width:100%;height:50px;border:none;border-radius:14px;background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;font-size:0.92rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 10px 28px rgba(37,99,235,0.4);transition:0.2s;}
.btn:hover{transform:translateY(-1px);box-shadow:0 12px 32px rgba(37,99,235,0.5);}
.divider{display:flex;align-items:center;gap:14px;margin:20px 0;color:rgba(255,255,255,0.3);font-size:0.72rem;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.1);}
.social{display:flex;gap:10px;}
.social button{flex:1;height:46px;border-radius:13px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.8);font-size:0.98rem;cursor:pointer;transition:0.2s;display:flex;align-items:center;justify-content:center;gap:8px;}
.social button:hover{background:rgba(255,255,255,0.1);}
.foot{text-align:center;margin-top:22px;font-size:0.82rem;color:rgba(255,255,255,0.5);}
.foot a{color:#60a5fa;text-decoration:none;font-weight:600;}
.msg{display:none;align-items:center;gap:9px;padding:11px 14px;border-radius:12px;font-size:0.78rem;line-height:1.5;margin-bottom:16px;}
.msg.error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);color:#fca5a5;}
.msg.ok{background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.25);color:#6ee7b7;}
.btn[disabled]{opacity:0.6;cursor:default;transform:none !important;}
</style>
</head>
<body>
  <form class="auth" id="registerForm">
    <div class="brand">
      <div class="ic"><i class="fa-solid fa-bolt"></i></div>
      <div><h1>LUMA</h1><p>Your Personal OS</p></div>
    </div>
    <div class="head">
      <h2>Create your account</h2>
      <span>Let Lumi organise your day, money and goals.</span>
    </div>
    <div class="msg error" id="formError"></div>
    <div class="msg ok" id="formOk"></div>
    <div class="two">
      <div class="field"><label>First name</label><div class="inp"><i class="fa-regular fa-user"></i><input type="text" id="firstName" placeholder="Shirin" required></div></div>
      <div class="field"><label>Last name</label><div class="inp"><i class="fa-regular fa-user"></i><input type="text" id="lastName" placeholder="Aziz" required></div></div>
    </div>
    <div class="field"><label>Country</label><div class="inp"><i class="fa-solid fa-earth-asia"></i><select id="country" required><option value="" disabled selected>Select your country</option></select><i class="fa-solid fa-chevron-down caret"></i></div></div>
    <div class="field"><label>Time zone (GMT)</label><div class="inp"><i class="fa-regular fa-clock"></i><select id="timezone" required></select><i class="fa-solid fa-chevron-down caret"></i></div></div>
    <div class="field"><label>Email</label><div class="inp"><i class="fa-regular fa-envelope"></i><input type="email" id="email" placeholder="you@luma.os" required></div></div>
    <div class="field" style="margin-bottom:15px;">
      <label>Password</label>
      <div class="inp"><i class="fa-solid fa-lock"></i><input type="password" id="pw" placeholder="Create a password" required minlength="6" oninput="const v=this.value.length;document.querySelectorAll('.strength span').forEach((s,i)=>s.classList.toggle('on',v>i*3));"><i class="fa-regular fa-eye eye" onclick="const p=document.getElementById('pw');p.type=p.type==='password'?'text':'password';this.className=p.type==='password'?'fa-regular fa-eye eye':'fa-regular fa-eye-slash eye';"></i></div>
      <div class="strength"><span></span><span></span><span></span><span></span></div>
    </div>
    <div class="field" style="margin-bottom:20px;">
      <label>Confirm password</label>
      <div class="inp"><i class="fa-solid fa-lock"></i><input type="password" id="pw2" placeholder="Re-enter your password" required oninput="const m=document.getElementById('pwMatch');m.style.display=this.value?'flex':'none';const ok=this.value===document.getElementById('pw').value;m.style.color=ok?'#6ee7b7':'#fca5a5';m.innerHTML=ok?'<i class=&quot;fa-solid fa-check&quot;></i> Passwords match':'<i class=&quot;fa-solid fa-xmark&quot;></i> Passwords don\u2019t match';"><i class="fa-regular fa-eye eye" onclick="const p=document.getElementById('pw2');p.type=p.type==='password'?'text':'password';this.className=p.type==='password'?'fa-regular fa-eye eye':'fa-regular fa-eye-slash eye';"></i></div>
      <div id="pwMatch" style="display:none;align-items:center;gap:6px;font-size:0.7rem;margin-top:8px;"></div>
    </div>
    <label class="agree"><input type="checkbox" required> I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></label>
    <button class="btn" type="submit" id="submitBtn">Create account <i class="fa-solid fa-arrow-right"></i></button>
    <div class="divider">or sign up with</div>
    <div class="social">
      <button type="button" onclick="LumaAuth._comingSoon(this)"><i class="fa-brands fa-google"></i> Google</button>
      <button type="button" onclick="LumaAuth._comingSoon(this)"><i class="fa-brands fa-apple"></i> Apple</button>
    </div>
    <div class="foot">Already have an account? <a href="LUMA Login.html">Sign in</a></div>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabase-config.js"></script>
  <script src="assets/luma-auth.js"></script>
  <script>
    // fill the country list (shared with Edit profile)
    (function () { const tz = document.getElementById('timezone'); tz.innerHTML = LumaAuth.timezoneOptions(LumaAuth.browserTimezone()); const sel = document.getElementById('country'); (window.LumaAuth && LumaAuth.COUNTRIES || []).forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; sel.appendChild(o); }); })();
    LumaAuth.redirectIfSignedIn();

    LumaAuth._comingSoon = (btn) => {
      const label = btn.textContent.trim();
      showError(label + " sign-up isn't connected yet \u2014 create an account with email for now.");
    };

    const form = document.getElementById("registerForm");
    const errEl = document.getElementById("formError");
    const okEl = document.getElementById("formOk");
    const submitBtn = document.getElementById("submitBtn");

    function showError(text) {
      okEl.style.display = "none";
      errEl.textContent = text;
      errEl.style.display = "flex";
    }
    function showOk(text) {
      errEl.style.display = "none";
      okEl.textContent = text;
      okEl.style.display = "flex";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errEl.style.display = "none";
      okEl.style.display = "none";

      const firstName = document.getElementById("firstName").value.trim();
      const lastName = document.getElementById("lastName").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("pw").value;
      const password2 = document.getElementById("pw2").value;

      if (password !== password2) {
        showError("Passwords don't match.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Creating account\u2026';

      const country = document.getElementById("country").value;
      const { data, error } = await LumaAuth.signUp({ firstName, lastName, email, password, country, timezone: document.getElementById("timezone").value });

      submitBtn.disabled = false;
      submitBtn.innerHTML = 'Create account <i class="fa-solid fa-arrow-right"></i>';

      if (error) {
        showError(error.message);
        return;
      }

      if (data.session) {
        window.location.href = "LUMA Glass Dashboard.html";
        return;
      }

      // No session came back. If the project doesn't require email confirmation, signing in right now works.
      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Signing you in\u2026';
      const signedIn = await LumaAuth.signIn({ email, password, remember: true });
      if (!signedIn.error && signedIn.data && signedIn.data.session) {
        window.location.href = "LUMA Glass Dashboard.html";
        return;
      }

      // Email confirmation is required before a session is issued.
      submitBtn.disabled = false;
      submitBtn.innerHTML = 'Create account <i class="fa-solid fa-arrow-right"></i>';
      form.querySelectorAll("input, button").forEach((el) => (el.disabled = true));
      showOk("Account created. Check " + email + " for a confirmation link, then sign in.");
    });
  </script>
</body>
</html>
