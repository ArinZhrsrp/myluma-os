<!DOCTYPE html>
<html lang="en">
<head>
<script src="assets/luma-loader.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUMA · Reset password</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow-y:auto;background:#0a0e1a;}
body::before{content:'';position:fixed;inset:0;background:url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1920&q=80') center/cover no-repeat;filter:brightness(0.45) saturate(0.8) blur(1px);transform:scale(1.05);z-index:0;}
body::after{content:'';position:fixed;inset:0;background:rgba(6,10,20,0.35);z-index:0;}
.auth{position:relative;z-index:2;width:420px;max-width:100%;padding:38px 34px;border-radius:28px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);backdrop-filter:blur(34px) saturate(1.4);-webkit-backdrop-filter:blur(34px) saturate(1.4);box-shadow:0 24px 70px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.1);}
.brand{display:flex;align-items:center;gap:13px;margin-bottom:28px;}
.brand .ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;font-size:20px;box-shadow:0 0 26px rgba(59,130,246,0.35);}
.brand h1{color:#fff;font-size:19px;font-weight:600;letter-spacing:-0.01em;}
.brand p{color:rgba(255,255,255,0.4);font-size:12px;margin-top:2px;}
.head{margin-bottom:24px;}
.head h2{color:#fff;font-size:1.5rem;font-weight:600;letter-spacing:-0.02em;}
.head span{color:rgba(255,255,255,0.5);font-size:0.85rem;margin-top:6px;display:block;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:0.72rem;font-weight:500;color:rgba(255,255,255,0.55);margin-bottom:7px;}
.inp{display:flex;align-items:center;gap:11px;padding:0 15px;height:48px;border-radius:14px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);transition:0.2s;}
.inp:focus-within{border-color:#3b82f6;background:rgba(59,130,246,0.08);}
.inp i{color:rgba(255,255,255,0.4);font-size:0.9rem;width:18px;text-align:center;}
.inp input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:0.9rem;}
.inp input::placeholder{color:rgba(255,255,255,0.3);}
.inp .eye{cursor:pointer;}
.btn{width:100%;height:50px;border:none;border-radius:14px;background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;font-size:0.92rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 10px 28px rgba(37,99,235,0.4);transition:0.2s;margin-top:6px;}
.btn:hover{transform:translateY(-1px);box-shadow:0 12px 32px rgba(37,99,235,0.5);}
.btn[disabled]{opacity:0.6;cursor:default;transform:none !important;}
.foot{text-align:center;margin-top:24px;font-size:0.82rem;color:rgba(255,255,255,0.5);}
.foot a{color:#60a5fa;text-decoration:none;font-weight:600;}
.msg{display:none;align-items:center;gap:9px;padding:11px 14px;border-radius:12px;font-size:0.78rem;line-height:1.5;margin-bottom:16px;}
.msg.error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.25);color:#fca5a5;}
.msg.ok{background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.25);color:#6ee7b7;}
</style>
</head>
<body>
  <form class="auth" id="resetForm">
    <div class="brand">
      <div class="ic"><i class="fa-solid fa-bolt"></i></div>
      <div><h1>LUMA</h1><p>Your Personal OS</p></div>
    </div>
    <div class="head">
      <h2>Set a new password</h2>
      <span id="headSub">Opened from your email link — choose a new password below.</span>
    </div>
    <div class="msg error" id="formError"></div>
    <div class="msg ok" id="formOk"></div>
    <div class="field">
      <label>New password</label>
      <div class="inp"><i class="fa-solid fa-lock"></i><input type="password" id="pw" placeholder="Create a new password" required minlength="6"><i class="fa-regular fa-eye eye" onclick="const p=document.getElementById('pw');p.type=p.type==='password'?'text':'password';this.className=p.type==='password'?'fa-regular fa-eye eye':'fa-regular fa-eye-slash eye';"></i></div>
    </div>
    <div class="field">
      <label>Confirm new password</label>
      <div class="inp"><i class="fa-solid fa-lock"></i><input type="password" id="pw2" placeholder="Re-enter your new password" required><i class="fa-regular fa-eye eye" onclick="const p=document.getElementById('pw2');p.type=p.type==='password'?'text':'password';this.className=p.type==='password'?'fa-regular fa-eye eye':'fa-regular fa-eye-slash eye';"></i></div>
    </div>
    <button class="btn" type="submit" id="submitBtn">Update password <i class="fa-solid fa-arrow-right"></i></button>
    <div class="foot"><a href="LUMA Login.html">Back to sign in</a></div>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabase-config.js"></script>
  <script src="assets/luma-auth.js"></script>
  <script>
    const form = document.getElementById("resetForm");
    const errEl = document.getElementById("formError");
    const okEl = document.getElementById("formOk");
    const submitBtn = document.getElementById("submitBtn");
    const headSub = document.getElementById("headSub");

    function showError(text) {
      okEl.style.display = "none";
      errEl.textContent = text;
      errEl.style.display = "flex";
    }
    function showOk(text) {
      errEl.style.display = "none";
      okEl.textContent = text;
      okEl.style.display = "flex";
    }

    // The Supabase client reads the recovery token out of the URL on load and turns it into a temporary session.
    // We give it a moment, and if there is none we say WHY (an expired / already-used link, or a link that
    // Supabase refused to send here) instead of a vague message.
    (async () => {
      const params = new URLSearchParams((location.hash || "").replace(/^#/, ""));
      const query = new URLSearchParams(location.search);
      const urlCode = params.get("error_code") || query.get("error_code");
      const urlDesc = (params.get("error_description") || query.get("error_description") || "").replace(/\+/g, " ");
      let session = null;
      for (let i = 0; i < 8 && !session; i++) {
        session = await LumaAuth.getSession();
        if (!session) await new Promise((r) => setTimeout(r, 350));
      }
      if (!session) {
        headSub.textContent = "This link is invalid or has expired.";
        form.querySelectorAll("input, button[type=submit]").forEach((el) => (el.disabled = true));
        if (urlCode === "otp_expired") {
          showError("This reset link has expired or was already used. Some email programs open links automatically, which uses them up. Request a new link from the sign-in page and open it straight away.");
        } else if (urlDesc) {
          showError(urlDesc + " — request a new link from the sign-in page.");
        } else {
          showError('No reset link was found in this address. Request a new one from the sign-in page\'s "Forgot password?" link and open it from the email.');
        }
      }
    })();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errEl.style.display = "none";
      okEl.style.display = "none";

      const pw = document.getElementById("pw").value;
      const pw2 = document.getElementById("pw2").value;
      if (pw !== pw2) {
        showError("Passwords don't match.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = "Updating…";

      const { error } = await LumaAuth.updatePassword(pw);

      submitBtn.disabled = false;
      submitBtn.innerHTML = 'Update password <i class="fa-solid fa-arrow-right"></i>';

      if (error) {
        showError(error.message);
        return;
      }

      form.querySelectorAll("input, button").forEach((el) => (el.disabled = true));
      showOk("Password updated. Redirecting to sign in…");
      await LumaAuth.signOut();
      setTimeout(() => (window.location.href = "LUMA Login.html"), 1800);
    });
  </script>
</body>
</html>
