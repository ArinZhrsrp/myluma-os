<!--@modals-->
  <button class="fab" id="fab" title="Ask Lumi"><i class="fa-solid fa-robot"></i><span class="fab-dot"></span></button>

  <div class="chat-pop" id="chatPop">
    <div class="chat-pop-head">
      <div class="orb"><i class="fa-solid fa-sparkles"></i></div>
      <div>
        <div class="t">Lumi</div>
        <div class="s"><span class="dot"></span> Online · ready to help</div>
      </div>
      <button class="x" id="chatClose"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="chat-pop-body" id="popBody">
      <div class="bubble ai">Hi <span class="js-user-name">there</span> 👋 I'm Lumi. I can add events, tasks, notes and
        expenses, log your health, and answer questions about your data. Try: <i>“Add dentist on Friday 3pm”</i>.</div>
    </div>
    <div class="chat-pop-foot">
      <div class="chat-pop-chips">
        <span class="chip">What should I focus on today?</span>
        <span class="chip">How is my spending?</span>
        <span class="chip">Log 500ml water</span>
      </div>
      <div class="lumi-left" style="font-size:0.68rem;color:rgba(255,255,255,0.6);text-align:right;margin:2px 4px 6px;">
        15 questions per day</div>
      <div class="chat-input" style="margin-top:0;">
        <input id="popInput" placeholder="Message Lumi…" autocomplete="off">
        <button class="chat-send" id="popSend"><i class="fa-solid fa-arrow-up"></i></button>
      </div>
    </div>
  </div>
