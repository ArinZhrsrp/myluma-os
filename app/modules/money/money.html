<!--@modals-->
  <div class="modal-overlay confirm-overlay" id="moneyAllOverlay">
    <div class="profile-edit-modal" style="width:560px;max-width:100%">
      <div class="pem-head">
        <div class="pem-title">All transactions</div>
        <button class="x" id="mAllClose"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="mall-bar">
        <div class="mall-nav"><button type="button" id="mAllPrev" title="Previous month"><i class="fa-solid fa-chevron-left"></i></button><span id="mAllMonth"></span><button type="button" id="mAllNext" title="Next month"><i class="fa-solid fa-chevron-right"></i></button></div>
        <div class="mall-day"><select id="mAllDay" title="Day"></select></div>
      </div>
      <div class="mall-stats" id="mAllSum"></div>
      <div id="mAllList"></div>
      <div class="pem-actions"><button class="confirm-btn cancel" id="mAllDone" style="flex:1">Close</button></div>
    </div>
  </div>

  <div class="modal-overlay confirm-overlay" id="moneyEntryOverlay">
    <div class="profile-edit-modal" style="width:460px;max-width:100%">
      <div class="pem-head">
        <div class="pem-title" id="mEntryTitle">Log expense</div>
        <button class="x" id="mEntryClose"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="pem-msg error" id="mEntryError"></div>
      <div class="pem-field">
        <div class="h-days" id="mEntryKind"></div>
      </div>
      <div class="pem-field"><label>Amount (RM) <span style="color:#fca5a5">*</span></label><input id="mEntryAmount"
          type="text" inputmode="decimal" placeholder="e.g. 24.50" autocomplete="off"></div>
      <div class="pem-field"><label>What was it for?</label><input id="mEntryName" type="text" maxlength="80"
          placeholder="e.g. Grab, Jaya Grocer" autocomplete="off"></div>
      <div class="pem-field"><label>Category</label>
        <div class="g-cats" id="mEntryCats"></div>
      </div>
      <div class="pem-field"><label>Date</label><input id="mEntryDate" type="text"></div>
      <div class="pem-actions" style="gap:10px">
        <button type="button" class="h-del" id="mEntryDelete" title="Delete" aria-label="Delete" style="display:none"><i
            class="fa-regular fa-trash-can"></i></button>
        <button class="confirm-btn save" id="mEntrySave" style="flex:1">Save</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay confirm-overlay" id="moneyIncomeOverlay">
    <div class="profile-edit-modal" style="width:500px;max-width:100%">
      <div class="pem-head">
        <div class="pem-title">Income &amp; salary</div>
        <button class="x" id="mIncClose"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="pem-msg error" id="mIncError"></div>
      <div class="pem-field"><label>Country</label><select id="mIncCountry"></select></div>
      <div class="pem-field"><label id="mIncGrossLbl">Gross monthly salary (RM)</label><input id="mIncGross" type="text"
          inputmode="decimal" placeholder="e.g. 5000" autocomplete="off"></div>
      <div id="mIncMy">
        <div class="pem-field"><label>EPF (your share)</label>
          <div class="h-days" id="mIncEpf"></div>
        </div>
      </div>
      <div class="pem-field" id="mIncPcbWrap"><label>PCB (income tax) on your payslip (RM) <span
            style="color:rgba(255,255,255,0.35);font-weight:400">(optional)</span></label><input id="mIncPcb"
          type="text" inputmode="decimal" placeholder="Leave blank if none is deducted" autocomplete="off"></div>
      <div class="pem-field"><label>Pay day (day of the month)</label><input id="mIncPayDay" type="text"
          inputmode="numeric" placeholder="25" autocomplete="off"></div>
      <div class="m-break" id="mIncBreak"></div>
      <div class="pem-actions"><button class="confirm-btn save" id="mIncSave" style="flex:1">Save income</button></div>
    </div>
  </div>
