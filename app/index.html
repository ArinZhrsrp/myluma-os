<!DOCTYPE html>
<html lang="en">

<head>
  <script src="../shared/luma-loader.js"></script>
  <script>LumaLoader.hold('app');</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0a0e1a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LUMA">
  <link rel="apple-touch-icon" href="/shared/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/shared/icons/favicon-32.png">
  <title>LUMA</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <script>
    // The stylesheets get a changing ?v=… so a browser never keeps an old copy after an update (the scripts already do this in core/boot.js).
    // Live site: a new copy at most once an hour; staging and your computer: always fresh. responsive.css stays last.
    (function () {
      var v = location.hostname === 'myluma-os.vercel.app' ? Math.floor(Date.now() / 36e5) : Date.now();
      [
      'core/core.css',
      'modules/notifications/notifications.css',
      'modules/contacts/contacts.css',
      'modules/health/health.css',
      'modules/purchases/purchases.css',
      'modules/split/split.css',
      'modules/settings/settings.css',
      'modules/focus/focus.css',
      'modules/tasks/tasks.css',
      'modules/calendar/calendar.css',
      'modules/money/money.css',
      'modules/bills/bills.css',
      'modules/subscriptions/subscriptions.css',
      'modules/goals/goals.css',
      'modules/habits/habits.css',
      'modules/analytics/insights.css',
      'modules/dashboard/dashboard.css',
      'modules/reminders/reminders.css',
      'modules/work/work.css',
      'modules/study/study.css',
      'modules/admin/admin.css',
      'modules/adminreport/adminreport.css',
      'modules/documents/documents.css',
      'modules/notes/notes.css',
      'modules/assistant/assistant.css',
      'modules/support/support.css',
      'modules/feedback/feedback.css',
      'core/responsive.css'
      ].forEach(function (h) { document.write('<link rel="stylesheet" href="' + h + '?v=' + v + '">'); });
    })();
  </script>
</head>

<body>
  <!-- The page's markup comes from each module's .html file; core/boot.js assembles it and then loads the scripts in order. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../shared/luma-install.js"></script>
  <script defer src="../shared/supabase-config.js"></script>
  <script defer src="../shared/luma-auth.js"></script>
  <script defer src="../shared/plan-config.js"></script>
  <script defer src="../shared/luma-plan.js"></script>
  <script defer src="../shared/luma-space.js"></script>
  <script defer src="modules/contacts/contacts.data.js"></script>
  <script defer src="modules/tasks/tasks.data.js"></script>
  <script defer src="modules/documents/documents.data.js"></script>
  <script defer src="modules/notes/notes.data.js"></script>
  <script defer src="../shared/push-config.js"></script>
  <script defer src="modules/notifications/notifications.data.js"></script>
  <script defer src="modules/health/health.data.js"></script>
  <script defer src="modules/habits/habits.data.js"></script>
  <script defer src="modules/goals/goals.data.js"></script>
  <script defer src="modules/bills/bills.data.js"></script>
  <script defer src="modules/money/money.data.js"></script>
  <script defer src="modules/calendar/calendar.data.js"></script>
  <script defer src="modules/reminders/reminders.data.js"></script>
  <script defer src="modules/study/study.data.js"></script>
  <script defer src="core/boot.js"></script>
</body>

</html>
